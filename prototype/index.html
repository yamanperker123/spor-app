<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spor App Prototip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" id="app">
    <header class="topbar">
      <button class="icon-btn back" id="backBtn" aria-label="Geri" data-i18n-aria="back">&#8592;</button>
      <div class="lang-toggle" role="group" aria-label="Language">
        <button data-lang="tr" class="active">TR</button>
        <button data-lang="en">EN</button>
      </div>
    </header>

    <!-- 1. Welcome: join with code -->
    <section class="screen active" data-screen="welcome">
      <div class="brand">
        <div class="logo">S</div>
        <h1 data-i18n="welcome.title"></h1>
        <p class="sub" data-i18n="welcome.sub"></p>
      </div>
      <div class="stack">
        <label class="field" for="code0" data-i18n="welcome.codeLabel"></label>
        <div class="code" id="codeBoxes">
          <input id="code0" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="1">
          <input inputmode="numeric" maxlength="1" aria-label="2">
          <input inputmode="numeric" maxlength="1" aria-label="3">
          <input inputmode="numeric" maxlength="1" aria-label="4">
          <input inputmode="numeric" maxlength="1" aria-label="5">
          <input inputmode="numeric" maxlength="1" aria-label="6">
        </div>
        <p class="error" id="codeError"></p>
        <button class="btn btn-primary" id="joinBtn" disabled data-i18n="welcome.join"></button>
      </div>
      <div class="divider" data-i18n="common.or"></div>
      <button class="btn btn-secondary" data-go="create" data-i18n="welcome.create"></button>
      <div class="spacer"></div>
      <p class="center sub">
        <span data-i18n="welcome.haveAccount"></span>
        <button class="btn-link" data-go="login" data-i18n="welcome.login"></button>
      </p>
      <p class="center hint" data-i18n="welcome.demo"></p>
    </section>

    <!-- 2. Name: how you appear in the lobby -->
    <section class="screen" data-screen="name">
      <div class="card soft lobby-preview">
        <div class="lobby-avatar">&#127939;</div>
        <div>
          <strong id="previewName"></strong>
          <span class="meta" id="previewMeta"></span>
        </div>
      </div>
      <h2 data-i18n="name.title"></h2>
      <label class="field">
        <span data-i18n="name.label"></span>
        <input class="input" id="nameInput" autocomplete="name" data-i18n-placeholder="name.placeholder">
        <span class="hint" data-i18n="name.hint"></span>
      </label>
      <div class="spacer"></div>
      <button class="btn btn-primary" id="nameBtn" disabled data-i18n="name.continue"></button>
    </section>

    <!-- 3a. Pending approval (lobby in approval mode) -->
    <section class="screen" data-screen="pending">
      <div class="status-icon wait">&#9203;</div>
      <h2 class="center" data-i18n="pending.title"></h2>
      <p class="center sub" data-i18n="pending.sub"></p>
      <div class="card soft lobby-preview">
        <div class="lobby-avatar">&#127939;</div>
        <div>
          <strong id="pendingLobby"></strong>
          <span class="meta" data-i18n="pending.meta"></span>
        </div>
      </div>
      <div class="spacer"></div>
      <button class="btn btn-primary" id="simulateApprove" data-i18n="pending.simulate"></button>
      <button class="btn btn-secondary" data-go="welcome" data-i18n="pending.cancel"></button>
    </section>

    <!-- 3b. Joined -->
    <section class="screen" data-screen="joined">
      <div class="status-icon ok">&#10003;</div>
      <h2 class="center" id="joinedTitle"></h2>
      <p class="center sub" data-i18n="joined.sub"></p>
      <div class="banner" id="accountBanner">
        <span aria-hidden="true">&#128274;</span>
        <div>
          <p data-i18n="joined.bannerText"></p>
          <button class="btn-link" data-go="account" data-i18n="joined.bannerCta"></button>
        </div>
      </div>
      <div class="spacer"></div>
      <button class="btn btn-primary" id="joinedToLobby" data-i18n="joined.toLobby"></button>
      <button class="btn btn-secondary" data-go="welcome" data-i18n="joined.another"></button>
    </section>

    <!-- 4. Link account -->
    <section class="screen" data-screen="account">
      <h2 data-i18n="account.title"></h2>
      <p class="sub" data-i18n="account.sub"></p>
      <form class="stack" id="accountForm" novalidate>
        <label class="field">
          <span data-i18n="account.username"></span>
          <input class="input" id="accUser" autocomplete="username">
        </label>
        <label class="field">
          <span data-i18n="account.email"></span>
          <input class="input" id="accEmail" type="email" autocomplete="email">
          <span class="hint" data-i18n="account.emailHint"></span>
        </label>
        <label class="field">
          <span data-i18n="account.password"></span>
          <input class="input" id="accPass" type="password" autocomplete="new-password">
          <span class="hint" data-i18n="account.passwordHint"></span>
        </label>
        <p class="error" id="accountError"></p>
        <button class="btn btn-primary" type="submit" data-i18n="account.save"></button>
      </form>
    </section>

    <!-- 5. Log in -->
    <section class="screen" data-screen="login">
      <h2 data-i18n="login.title"></h2>
      <form class="stack" id="loginForm" novalidate>
        <label class="field">
          <span data-i18n="login.user"></span>
          <input class="input" id="loginUser" autocomplete="username">
        </label>
        <label class="field">
          <span data-i18n="login.password"></span>
          <input class="input" id="loginPass" type="password" autocomplete="current-password">
        </label>
        <p class="error" id="loginError"></p>
        <button class="btn btn-primary" type="submit" data-i18n="login.submit"></button>
      </form>
      <button class="btn-link" data-go="forgot" data-i18n="login.forgot"></button>
    </section>

    <!-- 6. Forgot password -->
    <section class="screen" data-screen="forgot">
      <h2 data-i18n="forgot.title"></h2>
      <p class="sub" data-i18n="forgot.sub"></p>
      <form class="stack" id="forgotForm" novalidate>
        <label class="field">
          <span data-i18n="account.email"></span>
          <input class="input" id="forgotEmail" type="email" autocomplete="email">
        </label>
        <p class="error" id="forgotError"></p>
        <button class="btn btn-primary" type="submit" data-i18n="forgot.submit"></button>
      </form>
    </section>

    <!-- 7. Create lobby -->
    <section class="screen" data-screen="create">
      <h2 data-i18n="create.title"></h2>
      <form class="stack" id="createForm" novalidate>
        <label class="field">
          <span data-i18n="create.name"></span>
          <input class="input" id="lobbyName" data-i18n-placeholder="create.namePlaceholder">
        </label>
        <label class="field">
          <span data-i18n="create.yourName"></span>
          <input class="input" id="ownerName" autocomplete="name">
        </label>
        <div class="card toggle-row">
          <div>
            <strong data-i18n="create.approval"></strong>
            <div class="meta" data-i18n="create.approvalHint"></div>
          </div>
          <label class="switch">
            <input type="checkbox" id="approvalToggle">
            <span></span>
          </label>
        </div>
        <p class="error" id="createError"></p>
        <button class="btn btn-primary" type="submit" data-i18n="create.submit"></button>
      </form>
    </section>

    <!-- 8. Lobby created: share code -->
    <section class="screen" data-screen="created">
      <div class="status-icon ok">&#10003;</div>
      <h2 class="center" id="createdTitle"></h2>
      <p class="center sub" data-i18n="created.sub"></p>
      <div class="big-code" id="newCode"></div>
      <div class="row">
        <button class="btn btn-secondary" id="copyCode" data-i18n="created.copy"></button>
        <button class="btn btn-secondary" id="shareCode" data-i18n="created.share"></button>
      </div>
      <p class="center hint" id="createdMode"></p>
      <div class="spacer"></div>
      <button class="btn btn-primary" id="toLobby" data-i18n="created.toLobby"></button>
    </section>

    <!-- 9. My lobbies -->
    <section class="screen" data-screen="lobbies">
      <h2 data-i18n="lobbies.title"></h2>
      <div class="stack" id="lobbyList"></div>
      <div class="stack" id="archivedList"></div>
      <div class="spacer"></div>
      <div class="row">
        <button class="btn btn-secondary" data-go="welcome" data-i18n="lobbies.join"></button>
        <button class="btn btn-secondary" data-go="create" data-i18n="lobbies.create"></button>
      </div>
    </section>

    <!-- 10. Lobby home: stats, next workout, calendar -->
    <section class="screen lobby-screen" data-screen="lobby">
      <div class="lobby-preview">
        <div class="lobby-avatar" id="lobbyIcon"></div>
        <div class="grow">
          <h2 id="lobbyTitle"></h2>
          <span class="meta" id="lobbyMeta"></span>
        </div>
        <span class="chip" id="lobbyRole"></span>
      </div>

      <!-- Tab: calendar -->
      <div class="tab-panel" data-panel="calendar">
      <div class="stats" id="lobbyStats"></div>
      <div id="nextWorkout"></div>
      <button class="btn btn-secondary" id="addWorkout" data-add data-i18n="lobby.addWorkout"></button>

      <div class="cal-toolbar">
        <div class="segmented" role="tablist">
          <button role="tab" data-view="week" data-i18n="lobby.week"></button>
          <button role="tab" data-view="month" data-i18n="lobby.month"></button>
        </div>
        <div class="cal-nav">
          <button class="icon-btn" id="calPrev" data-i18n-aria="lobby.prev">&#8249;</button>
          <span id="calLabel"></span>
          <button class="icon-btn" id="calNext" data-i18n-aria="lobby.nextPeriod">&#8250;</button>
        </div>
      </div>
      <div id="calendar"></div>
      <div class="legend" id="calLegend"></div>
      <div class="stack" id="dayList"></div>
      </div>

      <!-- Tab: members -->
      <div class="tab-panel" data-panel="members" id="membersPanel"></div>

      <!-- Tab: settings -->
      <div class="tab-panel" data-panel="settings">
        <div id="settingsCoach" class="stack">
          <label class="field">
            <span data-i18n="settings.name"></span>
            <div class="row">
              <input class="input grow" id="setName">
              <button class="btn btn-secondary btn-sm" id="setNameSave" data-i18n="settings.saveName"></button>
            </div>
          </label>
        </div>
        <div class="field">
          <span data-i18n="settings.code"></span>
          <div class="big-code" id="setCode"></div>
          <div class="row">
            <button class="btn btn-secondary" id="setCopy" data-i18n="settings.copy"></button>
            <button class="btn btn-secondary" id="setRegen" data-i18n="settings.regen"></button>
          </div>
        </div>
        <div class="card toggle-row" id="setApprovalRow">
          <div>
            <strong data-i18n="create.approval"></strong>
            <div class="meta" data-i18n="create.approvalHint"></div>
          </div>
          <label class="switch">
            <input type="checkbox" id="setApproval">
            <span></span>
          </label>
        </div>
        <button class="btn btn-secondary" id="setLeave" data-i18n="settings.leave"></button>
        <div class="danger-zone" id="setDanger">
          <strong data-i18n="settings.danger"></strong>
          <p class="meta" data-i18n="settings.dissolveHint"></p>
          <button class="btn btn-danger" id="setDissolve" data-i18n="settings.dissolve"></button>
        </div>
      </div>

      <nav class="bottom-nav">
        <button data-tab="calendar"><span aria-hidden="true">&#128197;</span><span data-i18n="lobby.navCalendar"></span></button>
        <button data-tab="members"><span aria-hidden="true">&#128101;</span><span data-i18n="lobby.navMembers"></span></button>
        <button data-tab="settings"><span aria-hidden="true">&#9881;</span><span data-i18n="lobby.navSettings"></span></button>
      </nav>
    </section>

    <!-- 13. Member detail (coach): stats per student, role, remove -->
    <section class="screen" data-screen="member">
      <div class="lobby-preview">
        <div class="avatar-lg" id="mInitials"></div>
        <div class="grow">
          <h2 id="mName"></h2>
          <span class="meta" id="mLobby"></span>
        </div>
        <span class="chip" id="mRole"></span>
      </div>
      <div id="mBody"></div>
      <div class="stack" id="mActions">
        <button class="btn btn-secondary" id="mToggleRole"></button>
        <button class="btn btn-danger" id="mKick"></button>
      </div>
    </section>

    <!-- 11. Workout detail: exercises, "Geldim", attendance (coach) -->
    <section class="screen" data-screen="workout">
      <div>
        <span class="eyebrow" id="wLobby"></span>
        <h2 id="wTitle"></h2>
        <span class="meta" id="wWhen"></span>
        <div class="chips" id="wChips"></div>
      </div>
      <div id="wAction"></div>
      <div id="wBody">
        <h3 class="section-title" data-i18n="workout.exercises"></h3>
        <ol class="exercise-list" id="wExercises"></ol>
      </div>
      <div id="wAttendance"></div>
    </section>

    <!-- 12. Workout editor (coach): create / edit / delete -->
    <section class="screen" data-screen="editor">
      <h2 id="edTitle"></h2>
      <form class="stack" id="editorForm" novalidate>
        <label class="field">
          <span data-i18n="editor.name"></span>
          <input class="input" id="edName" data-i18n-placeholder="editor.namePh">
        </label>
        <div class="row">
          <label class="field grow">
            <span data-i18n="editor.date"></span>
            <input class="input" id="edDate" type="date">
          </label>
          <label class="field" style="width: 120px">
            <span data-i18n="editor.time"></span>
            <input class="input" id="edTime" type="time">
          </label>
        </div>

        <div class="field">
          <span data-i18n="editor.type"></span>
          <div class="segmented wide" role="radiogroup">
            <button type="button" role="radio" data-type="group" data-i18n="editor.group"></button>
            <button type="button" role="radio" data-type="individual" data-i18n="editor.individual"></button>
          </div>
          <span class="hint" id="edTypeHint"></span>
        </div>
        <label class="field" id="edStudentField">
          <span data-i18n="editor.student"></span>
          <select class="input" id="edStudent"></select>
        </label>

        <div class="field">
          <span data-i18n="editor.exercises"></span>
          <ol class="ex-edit-list" id="edExercises"></ol>
          <button type="button" class="btn btn-secondary" id="edAdd" data-i18n="editor.add"></button>
          <span class="hint" data-i18n="editor.quick"></span>
          <div class="quick-add" id="edQuick"></div>
          <span class="hint" data-i18n="editor.dragHint"></span>
        </div>

        <p class="error" id="edError"></p>
        <button class="btn btn-primary" type="submit" id="edSave"></button>
        <button type="button" class="btn btn-danger" id="edDelete"></button>
      </form>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <!-- Prototype-only: jump between screens -->
  <nav class="proto-nav" id="protoNav">
    <ul id="protoList"></ul>
    <button id="protoRole" class="proto-role"></button>
    <button id="protoToggle" data-i18n="proto.screens"></button>
  </nav>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
  <script src="lobby.js"></script>
  <script src="workout.js"></script>
  <script src="editor.js"></script>
  <script src="manage.js"></script>
</body>
</html>
